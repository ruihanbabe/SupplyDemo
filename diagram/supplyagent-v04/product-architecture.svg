<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1120" role="img" aria-labelledby="title desc">
  <title id="title">SupplyAgent v0.4 产品架构</title>
  <desc id="desc">多租户 CRM 与供应链处置系统。Web、渠道与 API 写入 SQL Job；Worker 通过 PiRuntimeAdapter 驱动 Pi Agent；工具、审批、数据库、知识和审计均在服务端边界内。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    .title { fill:#f8fafc; font-size:25px; font-weight:700; }
    .subtitle { fill:#94a3b8; font-size:12px; }
    .region { font-size:12px; font-weight:700; }
    .name { fill:#f8fafc; font-size:13px; font-weight:700; }
    .detail { fill:#cbd5e1; font-size:10px; }
    .tiny { fill:#94a3b8; font-size:9px; }
    .arrowlabel { fill:#cbd5e1; font-size:9px; font-weight:500; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width=".5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb923c"/></marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="1660" height="1120" fill="#0f172a"/>
  <rect width="1660" height="1120" fill="url(#grid)"/>

  <text x="38" y="43" class="title">SupplyAgent v0.4 · AI Native CRM 与供应链处置系统</text>
  <text x="38" y="65" class="subtitle">产品外壳采用多租户 SQL Runtime；Pi 只作为受控 Agent loop 执行引擎；采购证据与审批内核继续保留</text>

  <!-- region boundaries -->
  <rect x="28" y="100" width="268" height="755" rx="14" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="45" y="123" fill="#22d3ee" class="region">1 · 用户与产品入口</text>
  <rect x="320" y="100" width="1010" height="755" rx="14" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="338" y="123" fill="#34d399" class="region">2 · 服务端可信边界 · 组织隔离、受控运行与证据</text>
  <rect x="1355" y="100" width="275" height="755" rx="14" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="1372" y="123" fill="#fb7185" class="region">3 · 人工决策与渠道</text>
  <rect x="28" y="883" width="1602" height="195" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="45" y="906" fill="#fbbf24" class="region">4 · SQL 事实、知识、审计与评估底座</text>

  <!-- connectors behind boxes -->
  <path d="M268 208 H362" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrowCyan)"/>
  <path d="M268 381 H362" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrowCyan)"/>
  <path d="M570 238 H652" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrowOrange)"/>
  <path d="M825 234 H900" fill="none" stroke="#34d399" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
  <path d="M1032 237 H1090" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M1195 300 V398 H1055" fill="none" stroke="#34d399" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
  <path d="M875 354 V474" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M875 614 V704 H680" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M875 614 V704 H1040" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M1226 694 H1375" fill="none" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrowRose)"/>
  <path d="M1468 448 V545" fill="none" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrowRose)"/>
  <path d="M1468 706 V790" fill="none" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrowRose)"/>
  <path d="M525 796 V942" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M875 796 V942" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M1165 796 V942" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M1226 734 H1280 V964" fill="none" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <path d="M525 1030 H1030" fill="none" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <text x="284" y="193" class="arrowlabel">认证 API / SSE</text>
  <text x="582" y="223" class="arrowlabel">创建 Mission / Run / Job</text>
  <text x="833" y="219" class="arrowlabel">claim / lease</text>
  <text x="1040" y="222" class="arrowlabel">受控模型调用</text>
  <text x="1090" y="381" class="arrowlabel">事件 / 工具结果</text>
  <text x="888" y="421" class="arrowlabel">Pi JSONL IPC</text>
  <text x="893" y="685" class="arrowlabel">只读 / Proposal 工具</text>
  <text x="1240" y="681" class="arrowlabel">需人审</text>

  <!-- left -->
  <g>
    <rect x="55" y="155" width="213" height="106" rx="8" fill="#0f172a"/>
    <rect x="55" y="155" width="213" height="106" rx="8" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="162" y="185" class="name" text-anchor="middle">React Workbench</text>
    <text x="162" y="206" class="detail" text-anchor="middle">客户 · 商机 · 案子 · Kanban</text>
    <text x="162" y="224" class="detail" text-anchor="middle">审批收件箱 · 时间线 · 配额</text>
    <text x="162" y="242" class="tiny" text-anchor="middle">只读投影 + 受控人工动作</text>
  </g>
  <g>
    <rect x="55" y="328" width="213" height="106" rx="8" fill="#0f172a"/>
    <rect x="55" y="328" width="213" height="106" rx="8" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="162" y="358" class="name" text-anchor="middle">渠道事件入口</text>
    <text x="162" y="379" class="detail" text-anchor="middle">WhatsApp 客户会话</text>
    <text x="162" y="397" class="detail" text-anchor="middle">飞书内部协作</text>
    <text x="162" y="415" class="tiny" text-anchor="middle">签名验证 · 去重 · 身份绑定</text>
  </g>
  <g>
    <rect x="55" y="502" width="213" height="129" rx="8" fill="#0f172a"/>
    <rect x="55" y="502" width="213" height="129" rx="8" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="162" y="532" class="name" text-anchor="middle">角色与对象 Scope</text>
    <text x="162" y="553" class="detail" text-anchor="middle">销售 / 采购 / 工程 / 主管</text>
    <text x="162" y="571" class="detail" text-anchor="middle">计划员 / 审计员 / 管理员</text>
    <text x="162" y="589" class="tiny" text-anchor="middle">身份不等于永久执行权限</text>
  </g>

  <!-- API / runtime -->
  <g>
    <rect x="362" y="174" width="208" height="128" rx="8" fill="#0f172a"/>
    <rect x="362" y="174" width="208" height="128" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="466" y="205" class="name" text-anchor="middle">服务端 API / Identity</text>
    <text x="466" y="226" class="detail" text-anchor="middle">认证 · organization_id · RBAC</text>
    <text x="466" y="244" class="detail" text-anchor="middle">RLS 上下文 · 请求校验</text>
    <text x="466" y="262" class="detail" text-anchor="middle">SSE Event-ID 回放</text>
    <text x="466" y="280" class="tiny" text-anchor="middle">HTTP 只写入命令/Job，不跑 Agent</text>
  </g>
  <g>
    <rect x="652" y="155" width="173" height="158" rx="8" fill="#0f172a"/>
    <rect x="652" y="155" width="173" height="158" rx="8" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="738" y="186" class="name" text-anchor="middle">SQL Job Queue</text>
    <text x="738" y="207" class="detail" text-anchor="middle">Mission / Run / Job</text>
    <text x="738" y="225" class="detail" text-anchor="middle">幂等键 · 优先级 · 可见时间</text>
    <text x="738" y="243" class="detail" text-anchor="middle">cancel · retry · dead letter</text>
    <text x="738" y="274" class="tiny" text-anchor="middle">SQL 是事实来源</text>
  </g>
  <g>
    <circle cx="875" cy="236" r="118" fill="#0f172a"/>
    <circle cx="875" cy="236" r="118" fill="rgba(6,78,59,.35)" stroke="#34d399" stroke-width="2"/>
    <text x="875" y="202" class="name" text-anchor="middle" font-size="17">RuntimeController / Worker</text>
    <text x="875" y="227" class="detail" text-anchor="middle">claim · lease · heartbeat · reaper</text>
    <text x="875" y="247" class="detail" text-anchor="middle">恢复 / 取消 / 重试 / 幂等</text>
    <text x="875" y="267" class="detail" text-anchor="middle">加载 checkpoint 与当前业务边界</text>
    <text x="875" y="287" class="tiny" text-anchor="middle">Worker 管生命周期，不负责 Agent 专业判断</text>
  </g>
  <g>
    <rect x="1090" y="155" width="210" height="150" rx="8" fill="#0f172a"/>
    <rect x="1090" y="155" width="210" height="150" rx="8" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1195" y="186" class="name" text-anchor="middle">Model Gateway / BYOK</text>
    <text x="1195" y="207" class="detail" text-anchor="middle">组织 Provider 策略与加密凭证</text>
    <text x="1195" y="225" class="detail" text-anchor="middle">预算预检 · usage · cost · audit</text>
    <text x="1195" y="243" class="detail" text-anchor="middle">Schema 修复 · 降级 · 限流</text>
    <text x="1195" y="274" class="tiny" text-anchor="middle">密钥绝不进 Pi / UI / Trace</text>
  </g>

  <!-- Pi and specialists -->
  <g>
    <rect x="738" y="474" width="274" height="140" rx="9" fill="#0f172a"/>
    <rect x="738" y="474" width="274" height="140" rx="9" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="875" y="506" class="name" text-anchor="middle">PiRuntimeAdapter · Node 子进程</text>
    <text x="875" y="529" class="detail" text-anchor="middle">Pi Agent Core：模型 / Tool Loop</text>
    <text x="875" y="549" class="detail" text-anchor="middle">versioned JSONL IPC：start / resume / cancel</text>
    <text x="875" y="569" class="detail" text-anchor="middle">事件 → SQL Trace / Artifact / checkpoint</text>
    <text x="875" y="593" class="tiny" text-anchor="middle">无 DB、渠道、Provider 凭证；无 shell/file 产品工具</text>
  </g>
  <g>
    <rect x="445" y="704" width="235" height="92" rx="8" fill="#0f172a"/>
    <rect x="445" y="704" width="235" height="92" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="562" y="733" class="name" text-anchor="middle">Specialist / Verifier</text>
    <text x="562" y="753" class="detail" text-anchor="middle">客户事实 · 采购 · 供应链影响</text>
    <text x="562" y="771" class="detail" text-anchor="middle">检索 · 验证 · Explainer</text>
    <text x="562" y="786" class="tiny" text-anchor="middle">隔离上下文，输出 Artifact/claims</text>
  </g>
  <g>
    <rect x="1040" y="704" width="186" height="92" rx="8" fill="#0f172a"/>
    <rect x="1040" y="704" width="186" height="92" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1133" y="733" class="name" text-anchor="middle">MCP 工具代理</text>
    <text x="1133" y="753" class="detail" text-anchor="middle">只读业务服务</text>
    <text x="1133" y="771" class="detail" text-anchor="middle">Proposal / 留档 / 配额</text>
    <text x="1133" y="786" class="tiny" text-anchor="middle">F07 / F11 / F13</text>
  </g>

  <!-- right decisions -->
  <g>
    <rect x="1375" y="155" width="186" height="119" rx="8" fill="#0f172a"/>
    <rect x="1375" y="155" width="186" height="119" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1468" y="185" class="name" text-anchor="middle">Proposal / Approval</text>
    <text x="1468" y="206" class="detail" text-anchor="middle">内容哈希 · 证据 · 有效期</text>
    <text x="1468" y="224" class="detail" text-anchor="middle">批准 / 拒绝 / 恢复</text>
    <text x="1468" y="245" class="tiny" text-anchor="middle">审批不等于永久运行许可</text>
  </g>
  <g>
    <rect x="1375" y="328" width="186" height="120" rx="8" fill="#0f172a"/>
    <rect x="1375" y="328" width="186" height="120" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1468" y="358" class="name" text-anchor="middle">执行前重校验</text>
    <text x="1468" y="379" class="detail" text-anchor="middle">角色 / scope / 草稿哈希</text>
    <text x="1468" y="397" class="detail" text-anchor="middle">opt-out / service revision</text>
    <text x="1468" y="415" class="tiny" text-anchor="middle">失败 → 反馈与重规划</text>
  </g>
  <g>
    <rect x="1375" y="545" width="186" height="161" rx="8" fill="#0f172a"/>
    <rect x="1375" y="545" width="186" height="161" rx="8" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="1468" y="576" class="name" text-anchor="middle">外部副作用 Adapter</text>
    <text x="1468" y="597" class="detail" text-anchor="middle">采购提交 · WhatsApp 发送</text>
    <text x="1468" y="615" class="detail" text-anchor="middle">飞书内部协作</text>
    <text x="1468" y="633" class="detail" text-anchor="middle">Send Ledger · 幂等键</text>
    <text x="1468" y="663" class="tiny" text-anchor="middle">真实调用须获 G5 授权</text>
  </g>
  <g>
    <rect x="1375" y="762" width="186" height="65" rx="8" fill="#0f172a"/>
    <rect x="1375" y="762" width="186" height="65" rx="8" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1468" y="789" class="name" text-anchor="middle">渠道结果 / 审计事件</text>
    <text x="1468" y="808" class="tiny" text-anchor="middle">回到 SQL Trace 与 Workbench</text>
  </g>

  <!-- data layer -->
  <g>
    <rect x="55" y="942" width="250" height="94" rx="8" fill="#0f172a"/>
    <rect x="55" y="942" width="250" height="94" rx="8" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="180" y="973" class="name" text-anchor="middle">PostgreSQL · RLS · SQL Trace</text>
    <text x="180" y="994" class="detail" text-anchor="middle">CRM / 供应链 / Run / Job / Event</text>
    <text x="180" y="1012" class="tiny" text-anchor="middle">Artifact · Proposal · Approval · Send Ledger</text>
  </g>
  <g>
    <rect x="340" y="942" width="230" height="94" rx="8" fill="#0f172a"/>
    <rect x="340" y="942" width="230" height="94" rx="8" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="455" y="973" class="name" text-anchor="middle">Redis / 支撑能力</text>
    <text x="455" y="994" class="detail" text-anchor="middle">限流 · 去重 · 短期 lease</text>
    <text x="455" y="1012" class="tiny" text-anchor="middle">不是业务事实来源</text>
  </g>
  <g>
    <rect x="605" y="942" width="270" height="94" rx="8" fill="#0f172a"/>
    <rect x="605" y="942" width="270" height="94" rx="8" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="740" y="973" class="name" text-anchor="middle">组织知识 / Wiki / Datasheet</text>
    <text x="740" y="994" class="detail" text-anchor="middle">私有文件 · ACL · 版本 · citations</text>
    <text x="740" y="1012" class="tiny" text-anchor="middle">全文检索 + 可选向量检索</text>
  </g>
  <g>
    <rect x="910" y="942" width="245" height="94" rx="8" fill="#0f172a"/>
    <rect x="910" y="942" width="245" height="94" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1032" y="973" class="name" text-anchor="middle">安全与证据门控</text>
    <text x="1032" y="994" class="detail" text-anchor="middle">Capability · Taint · Gate</text>
    <text x="1032" y="1012" class="tiny" text-anchor="middle">审批令牌 · 提交前重校验</text>
  </g>
  <g>
    <rect x="1190" y="942" width="370" height="94" rx="8" fill="#0f172a"/>
    <rect x="1190" y="942" width="370" height="94" rx="8" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1375" y="973" class="name" text-anchor="middle">可观测性、回放与 Eval</text>
    <text x="1375" y="994" class="detail" text-anchor="middle">Event-ID SSE · 数据/全回放 · 故障注入 · 分叉</text>
    <text x="1375" y="1012" class="tiny" text-anchor="middle">Langfuse / OTLP 可选且脱敏；不替代 SQL 审计</text>
  </g>

  <!-- legend -->
  <line x1="48" y1="1092" x2="88" y2="1092" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="98" y="1096" class="tiny">请求 / 状态流</text>
  <line x1="210" y1="1092" x2="250" y2="1092" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="260" y="1096" class="tiny">SQL Job / 队列</text>
  <line x1="390" y1="1092" x2="430" y2="1092" stroke="#fb7185" stroke-width="2" marker-end="url(#arrowRose)"/>
  <text x="440" y="1096" class="tiny">审批 / 外部副作用</text>
  <text x="1620" y="1096" class="tiny" text-anchor="end">v0.4 设计图 · 当前实现状态须以 features.json 与 Contract 为准</text>
</svg>
