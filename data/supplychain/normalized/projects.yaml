    total_quantity: 45
    corrections:   # 原始层未改；订正在 normalize_domdata.py 的 CORRECTIONS 中声明
      - 源行 5（3mm LED）：位号末项 "13" 补为 "d13"，qty 11→12。
        依据：项目 README "12 proxy LED indicate continuously which mode is currently being set."
      - 源行 15（MCP3208）：qty 1→2。
        依据：项目 README "2 ADC 8bit expander chips"；芯片座 qty=2 互证
      - 源行 16（MCP3208 芯片座）：位号由空补为 "u2,u3"。
        依据：DIP 座焊于 u2/u3 焊盘，芯片插入其中；源表漏填该字段
    known_gaps:
