# 射频开关术语表（mock 业务知识，spec §6；用于节点启动注入与 datasheet 检索同义词扩展）。
category: rf_switch
terms:
  - {term: isolation, synonyms: [隔离度, port-to-port isolation, off isolation], note: 关断支路对信号的抑制，dB 越大越好}
  - {term: insertion loss, synonyms: [插入损耗, IL], note: 导通支路的信号损失，dB 越小越好}
  - {term: SPDT, synonyms: [单刀双掷], note: 一个公共端切换到两个支路}
  - {term: SP4T, synonyms: [单刀四掷], note: 一个公共端切换到四个支路}
  - {term: return loss, synonyms: [回波损耗, VSWR, 驻波比], note: 端口匹配好坏}
  - {term: P1dB, synonyms: [1dB 压缩点, input P1dB], note: 输入功率使增益下降 1dB 的点，决定功率容量}
  - {term: IP3, synonyms: [三阶交调截点, IIP3], note: 线性度指标，越高越好}
  - {term: switching time, synonyms: [开关时间, switching speed], note: 控制信号变化到射频切换完成的时间}
  - {term: control logic, synonyms: [控制逻辑, logic level, 控制电平], note: 控制脚高低电平阈值，须与主控兼容}
  - {term: supply voltage, synonyms: [供电电压, VDD, VCC], note: 工作电压范围须覆盖板上供电}
  - {term: frequency range, synonyms: [工作频段, 频率范围, bandwidth], note: 须覆盖本板用到的全部频段}
  - {term: ESD, synonyms: [静电防护, HBM, ESD rating], note: 静电放电耐受等级}
  - {term: package, synonyms: [封装, footprint], note: 封装尺寸与引脚定义须一致才能直接替换}
  - {term: pin compatible, synonyms: [引脚兼容, pin-to-pin, drop-in], note: 不改板即可替换}
  - {term: harmonics, synonyms: [谐波, 2nd harmonic, 3rd harmonic], note: 大信号下产生的谐波分量}
  - {term: power handling, synonyms: [功率容量, max input power], note: 可长期承受的最大输入功率}
  - {term: current consumption, synonyms: [工作电流, supply current, IDD], note: 供电电流}
  - {term: operating temperature, synonyms: [工作温度, temperature range], note: 须覆盖产品温度等级}
  - {term: DC blocking, synonyms: [隔直电容, DC block], note: 射频端口是否需要外加隔直电容}
  - {term: absorptive, synonyms: [吸收式, reflective, 反射式], note: 关断端口是否端接 50Ω}
