# 射频综合器 / 混频器术语表（mock 业务知识）。
category: rf_synthesizer
terms:
  - {term: phase noise, synonyms: [相位噪声, SSB phase noise], note: 本振纯净度，dBc/Hz 越低越好}
  - {term: PLL, synonyms: [锁相环, phase locked loop], note: 频率合成的核心环路}
  - {term: VCO, synonyms: [压控振荡器], note: 输出频率随控制电压变化的振荡器}
  - {term: LO, synonyms: [本振, local oscillator], note: 混频所用的本地振荡信号}
  - {term: IF, synonyms: [中频, intermediate frequency], note: 混频后的中间频率}
  - {term: conversion gain, synonyms: [变频增益, conversion loss, 变频损耗], note: 混频器输入到输出的增益}
  - {term: frequency range, synonyms: [频率范围, tuning range, 调谐范围], note: 可合成的输出频率范围}
  - {term: reference clock, synonyms: [参考时钟, REF, reference frequency], note: 锁相环的参考输入}
  - {term: lock time, synonyms: [锁定时间, settling time], note: 改变频率到重新锁定的时间}
  - {term: spurious, synonyms: [杂散, spurs], note: 非期望的离散频率分量}
  - {term: fractional-N, synonyms: [小数分频], note: 支持小数分频比的锁相环}
  - {term: integer-N, synonyms: [整数分频], note: 只支持整数分频比}
  - {term: serial interface, synonyms: [串行接口, SPI, 3-wire], note: 寄存器配置接口，须与现有驱动兼容}
  - {term: register map, synonyms: [寄存器表, 寄存器映射], note: 软件兼容的关键；不同即需改固件}
  - {term: output power, synonyms: [输出功率, Pout], note: 输出电平}
  - {term: IP3, synonyms: [三阶交调截点, IIP3, OIP3], note: 线性度}
  - {term: noise figure, synonyms: [噪声系数, NF], note: 引入噪声的多少，越低越好}
  - {term: supply voltage, synonyms: [供电电压, VDD, VCC], note: 工作电压}
  - {term: package, synonyms: [封装, footprint], note: 封装与引脚定义}
  - {term: integrated mixer, synonyms: [集成混频器, mixer], note: 芯片内是否集成混频器}
