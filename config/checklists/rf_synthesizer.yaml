# 射频综合器 / 混频器品类比对清单（mock 业务策略，spec §1.3）。
category: rf_synthesizer
items:
  - {id: frequency,  name: 频率范围覆盖,          severity: critical}
  - {id: package,    name: 封装与引脚定义,        severity: critical}
  - {id: interface,  name: 串行接口与寄存器表兼容（不改固件）, severity: critical}
  - {id: phase_noise, name: 相位噪声 ≤ 原料,      severity: major}
  - {id: mixer,      name: 集成混频器等功能一致,  severity: major}
  - {id: supply,     name: 供电电压范围覆盖,      severity: major}
rules:
  - {when: {severity: critical, result: not_satisfied}, grade: C}
  - {when: {severity: critical, result: insufficient},  grade: B}
  - {when: {severity: major,    result: not_satisfied}, grade: B}
  - {when: {severity: major,    result: insufficient},  grade: B}
default_grade: A
