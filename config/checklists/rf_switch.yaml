# 射频开关品类比对清单（mock 业务策略，spec §1.3；Eval 判定替代结论的真值来源）。
category: rf_switch
items:
  - {id: package,       name: 封装与引脚定义,        severity: critical}
  - {id: band,          name: 工作频段覆盖,          severity: critical}
  - {id: isolation,     name: 隔离度 ≥ 原料,         severity: critical}
  - {id: insertion_loss, name: 插入损耗 ≤ 原料 + 0.2dB, severity: major}
  - {id: control_logic, name: 控制逻辑电平兼容,      severity: major}
  - {id: supply,        name: 供电电压范围覆盖,      severity: major}
  - {id: esd,           name: ESD 等级,              severity: minor}
# 等级规则：自上而下取第一条命中的（条件：某严重度出现某结论）。
rules:
  - {when: {severity: critical, result: not_satisfied}, grade: C}
  - {when: {severity: critical, result: insufficient},  grade: B}
  - {when: {severity: major,    result: not_satisfied}, grade: B}
  - {when: {severity: major,    result: insufficient},  grade: B}
default_grade: A
