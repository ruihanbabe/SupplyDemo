# LED 品类比对清单（mock 业务策略，spec §1.3）。
category: led
items:
  - {id: color,     name: 颜色（主波长接近）, severity: critical}
  - {id: package,   name: 封装与极性标识,     severity: critical}
  - {id: vf,        name: 正向电压接近（限流电阻不用改）, severity: major}
  - {id: intensity, name: 发光强度同档或更高, severity: major}
  - {id: angle,     name: 视角,               severity: minor}
rules:
  - {when: {severity: critical, result: not_satisfied}, grade: C}
  - {when: {severity: critical, result: insufficient},  grade: B}
  - {when: {severity: major,    result: not_satisfied}, grade: B}
default_grade: A
