# 电阻品类比对清单（mock 业务策略，spec §1.3；含采样电阻）。
category: resistor
items:
  - {id: resistance, name: 阻值,               severity: critical}
  - {id: package,    name: 封装尺寸（采样电阻含四端结构）, severity: critical}
  - {id: power,      name: 额定功率 ≥ 原料,     severity: critical}
  - {id: tolerance,  name: 精度 ≤ 原料,         severity: major}
  - {id: tcr,        name: 温度系数 ≤ 原料,     severity: major}
  - {id: temperature, name: 工作温度覆盖,       severity: minor}
rules:
  - {when: {severity: critical, result: not_satisfied}, grade: C}
  - {when: {severity: critical, result: insufficient},  grade: B}
  - {when: {severity: major,    result: not_satisfied}, grade: B}
  - {when: {severity: major,    result: insufficient},  grade: B}
default_grade: A
