# 工具代理层参数（F07，spec §5.4；G7）。配额数字是初始值，真实联调前按各家条款核实（spec §1.3）。

page_size: 10                    # 列表默认每页条数（spec §5.4 大结果）
conflict_tolerance_pct: 5        # 多源矛盾（B2）：同一参数相对差异超过该百分比即加警告

# 提供方的配额与限流（Redis：日计数 + 令牌桶）。daily_limit 为空表示不限；sim 是模拟环境，不计配额。
# 模型端点与分销商共用同一组件（F08 的 Limiter）。
providers:
  sim:        {daily_limit: null, rate_per_s: null, burst: null}
  digikey:    {daily_limit: 1000, rate_per_s: 2,    burst: 4}
  mouser:     {daily_limit: 1000, rate_per_s: 0.5,  burst: 2}
  element14:  {daily_limit: 1000, rate_per_s: 1,    burst: 2}
  glm-flash:  {daily_limit: null, rate_per_s: 1,    burst: 2}
  qwen-free:  {daily_limit: 50,   rate_per_s: 0.33, burst: 1}   # spec §5.3：每分钟 20 次、每天 50 次

# 工具的两个时钟：cache_ttl_s 按真实秒（省配额），valid_days 按模拟日（门控看它）。
tools:
  distributor_quotes: {cache_ttl_s: 1800, valid_days: 1}   # 报价 1 个模拟日内有效（spec §5.1 例）
