# Harness 配置（G7：业务与机制参数来自配置，不硬编码）。
# ablation：各 Harness 组件的消融开关（spec §0.3、§3.6）；true = 组件生效，false = 关掉它重跑 Eval（F28 读取）。
# 每个 Feature 只在这里加自己的键；键名即组件名，注释写明关掉后的行为。

ablation:
  invalidation_propagation: true   # F06 失效传播：false 时外部数据变化/过期不产生任何失效
  schema_repair: true              # F08 输出修复：false 时校验不过不回给模型修复，直接算格式失败
  model_fallback: true             # F08 模型降级：false 时主模型格式失败即失败，不换备用模型
  fabricated_mpn_check: true       # F08 编造料号拒绝：false 时不检查输出里的料号是否在已知集合
  tool_return_validation: true     # F07 返回校验（B3）：false 时不补"未知"、不加警告，原样交给模型
  source_conflict_warnings: true   # F07 多源矛盾（B2）：false 时不比对来源差异、不加警告
  loop_detection: true             # F09 循环检测：false 时相同调用照常执行，不反馈、不强制结束
  batch_join: true                 # F09 批次汇合：false 时每个任务完成都单独唤醒编排者一次
  context_assembly: true           # F16 分区组装：false 时把本案全部 Artifact 原文与全部事件直接塞进上下文
  tool_result_folding: true        # F16 旧工具结果折叠：false 时活跃段内工具结果全文保留
  capability_scope: true           # F11 令牌作用域：false 时不按料号作用域收窄与检查（工具集合与风险级检查照常）
  taint_tracking: true             # F13 污点汇点：false 时照常打标，但汇点不拦、不做疑似指令检测
  presubmit_revalidation: true     # F12 提交前重校验：false 时提交只查审批令牌，不实时复查库存与单价（A2 对照）
  same_source_merge: true          # F10 同源合并：false 时每颗缺料单独开案（A8 对照）
  supply_claims: true              # F10 软声明：false 时不登记、不判冲突、草稿门控不查声明（A9 对照）
  feedback_cards: true             # F14 反馈卡片：false 时不生成卡片，新反馈分区回到原始事件
  deviation_feedback: true         # F14 预期与偏差：false 时不比对预期（A1 对照）
  forced_escalation: true          # F14 代码强制升级：false 时只保留预算触顶

# F09 Runtime 硬预算与并发（spec §5.3 默认值）。
runtime:
  subagent: {max_rounds: 10, max_tool_calls: 12}   # 子 Agent：触顶交回"未完成"Artifact
  orchestrator: {max_rounds_per_segment: 12}       # 编排者每个活跃段：触顶结束本段并记录原因
  case: {max_replans: 3, max_llm_calls: 80}        # 案子：触顶升级给人，以"已升级"关闭
  max_active_cases: 4                              # 同时活跃（已开始处置、未关闭）的案子数上限，超出排队

# F16 上下文治理（spec §5.9 默认值）。token 为字符估算，真实联调后用 llm_call 的真实用量校准系数。
context:
  orchestrator_limit: 24000        # 编排者上下文上限（token）
  subagent_limit: 16000            # 子 Agent 上下文上限（token）
  fold_after_rounds: 3             # 活跃段内几轮之前的工具结果折叠为存根
  cjk_chars_per_token: 1           # 中日韩字符：每 token 字符数
  other_chars_per_token: 4         # 其他字符：每 token 字符数
  summary_max_chars: 160           # 默认代码摘要的最大长度
