# 模型端点与执行者 → 模型链（F08，spec §5.3 选型；G7）。
# quirks 是各端点工具调用格式的差异配置，由适配层统一成内部格式；
# 以下取值是按公开文档的初始假设，真实联调（需用户授权，G5）时逐项核实后改这里，不改代码。
# 凭证只写环境变量名（api_key_env），值不进配置、不进模型上下文、不进日志（G1）。

endpoints:
  glm-flash:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4.7-flash
    api_key_env: ZHIPU_API_KEY
    max_tokens: 2048
    timeout_s: 60
    quirks:
      parallel_tool_calls: true     # 一次可返回多个工具调用
      tool_choice: true             # 支持 tool_choice 参数
      json_mode: json_object        # json_schema | json_object | prompt（只在提示里给 Schema）
      max_tools: 8                  # 单次请求工具数上限（spec §5.4 每个执行者 ≤ 8）
      inline_tool_calls: false      # 工具调用是否可能写在正文 <tool_call> 里
  qwen-free:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3.8-27b:free
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 2048
    timeout_s: 60
    quirks:
      parallel_tool_calls: false
      tool_choice: false
      json_mode: prompt
      max_tools: 8
      inline_tool_calls: true

# 执行者 → 模型链：第一个是主模型，后面是按顺序的备用模型（spec §5.3 降级）。
executors:
  default: [glm-flash, qwen-free]
