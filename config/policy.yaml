# Policy（F21，spec §3.3；G7：规则与权重全部来自配置，LLM 不能改结果）。
version: 1                      # 策略版本（写入运行清单，spec §5.12）

avl: [digikey, mouser, element14]   # 合格分销商列表
banned: []                          # 禁用分销商
require_full_fill: true             # 硬约束：单家现货须满足需求数量
max_po_amount_usd: 20000            # 硬约束：单张采购单金额上限（美元）

# 打分权重（和为 1）：价格越低越好、到货越早越好、库存余量越大越好。
weights: {price: 0.5, eta: 0.35, stock_margin: 0.15}
stock_margin_target: 2.0            # 库存达到需求的 2 倍记满分
