# 事件接入与案子管理（F10，spec §5.2；G7：开案与路由参数放配置）。

version: 1

# Monitor 开案：由代码按影响分析开案（不交给 LLM）；开案模式与目标文本模板。
open_case:
  mode: S1                                   # 缺料处置走异常处置模式
  goal: "处置缺料：{targets}，保住相关工单开工与订单交期"   # {targets} 为"料号 缺 N 颗（第 D 天起）"列表
  id_prefix: "K"                             # 案子号前缀

# 路由投递的事件类型：实体键命中订阅即投递并唤醒；人工类事件直接唤醒所属案子。
routable: [env_day, monitor_shortage]
human: [human_decision, approval_granted]

# 用户中途插话（本期不处理）：记事件并回复该提示。
user_message_notice: "本期不支持中途修改，消息已记录，将在本案结束后处理"
