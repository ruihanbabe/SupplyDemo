# 权限策略（F11，spec §5.5、§3.4；G7：策略放配置，版本号写入运行清单 §5.12）。
# 工具的风险级（R0/R1/R2）由工具定义自己声明（src/tools/servers.py、src/business/procurement.py），这里只配"谁能用"。

version: 1

# 案子模式 → 允许的风险级（L1 可见性）。开案内容没写 mode 时用 default_mode（最小权限：只读问答）。
default_mode: S3
modes:
  S1: [R0, R1, R2]   # 异常处置：可写（草稿、送审、提交仍受 L3 门控，F12）
  S3: [R0]           # 互换问答：只读，写工具根本不可见（spec §2.1）

# 只有这些执行者能用 R1/R2 工具（spec §3.4"仅编排者"）；子令牌里不会出现写工具。
write_executors: [orchestrator]

# 执行者 → 本角色的工具（L1 的第二个交集）。编排者的根令牌 = 这里全部工具之并（本案能力上限），
# 派任务时子令牌 = 父令牌工具 ∩ 子执行者这一行（权限衰减）。代码组件也在这里登记（它们经代理层取数）。
executors:
  orchestrator: [dispatch_task, propose_goal_revision, report_to_planner, ask_user, end_segment, escalate_to_human,
                 propose_memory,
                 env_inventory, env_purchase_orders, env_shipments, env_work_orders, env_orders, read_record,
                 create_po_draft, request_approval, submit_po]
  impact_analysis: []
  sourcing: [distributor_quotes]
  policy: []
  procurement: [distributor_quotes]   # F12 提交前重校验以该身份实时查报价

# 同一执行者循环里被拒（无权限 / 工具不存在）累计达到该次数即强制结束（计入 §5.3 循环检测）。
max_denied_attempts: 3

# 拒绝后的合法路径引导（spec §5.5"拒绝后的处理"）：按工具名正则匹配，先匹配先用；都不匹配时按拒绝类别给提示。
guidance:
  - pattern: "reschedul|^(update|modify|change|cancel|delay|set|move)_(work_order|plan|schedule)"
    hint: "任何执行者都不能改排产、计划或工单（G8）；请用 report_to_planner 把影响分析上报计划员"
hints:
  write: "写操作仅编排者在 S1 异常处置模式下可用；子 Agent 请把结论交回编排者"
  role: "该工具不属于你的角色；请把需要的信息写进结论交回编排者"
  mode: "当前案子模式不允许该级别的工具；如需处置请提出目标修订（propose_goal_revision）"
  scope: "只能查询本任务作用域内的料号；需要其他料号请交回编排者重新派任务"
  case: "只能读本案子的留档记录"
  token: "调用身份无法核验，已拒绝"

# 凭证脱敏：这些键名（不分大小写，- 与 _ 等价）的值、以及 URL 查询参数中的同名项，写入留档 / 事件 / 错误信息前替换为 ***。
secrets:
  sensitive_keys: [authorization, api_key, apikey, x_api_key, token, access_token, refresh_token,
                   client_secret, secret, password, cookie, set_cookie]

# 出站白名单（防 SSRF）：各组件只能访问自己的上游域名（含子域）；只允许 HTTPS，禁止内网地址。
egress:
  digikey:   {domains: [api.digikey.com]}
  mouser:    {domains: [api.mouser.com]}
  element14: {domains: [api.element14.com]}
  datasheet:
    domains: [digikey.com, mouser.com, farnell.com, element14.com, newark.com,
              skyworksinc.com, analog.com, ti.com, st.com, nxp.com, microchip.com, onsemi.com, infineon.com,
              renesas.com, murata.com, tdk.com, vishay.com, diodes.com, nexperia.com, rohm.com, kemet.com,
              yageo.com, samsungsem.com, taiyo-yuden.com, bourns.com, littelfuse.com, molex.com, te.com]
    max_bytes: 20000000              # 单个 datasheet 上限 20 MB
    content_types: [application/pdf] # 只接受 PDF
    max_redirects: 5                 # 重定向跳数上限
