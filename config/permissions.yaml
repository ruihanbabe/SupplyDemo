# 全局权限层：这个部署里「存在」哪些权限。
#
# 三层策略的最外层，语义是交集而非覆盖——下层只能收紧。此处未授予的权限，
# 任何 worker 在自己的 yaml 里声明也无效。
#
# 缺少本文件等于什么都不授予，不是什么都授予：删掉一个配置文件不应该悄悄放宽访问。
#
# 命名是 <域>.<动作>。工具在 RegisteredTool.permission 上声明自己要哪一个，
# 因此新增工具若复用已有权限，无需改动任何 worker 配置。

granted:
  - catalog.read          # 项目、BOM 等静态目录的只读查询
  - procurement.compute   # 需求展开与缺口计算（只写内部快照，不触达外部）
  - documents.read        # 厂商官方资料的读取（F17 接入后生效）
  - sourcing.read         # 分销商库存与报价的只读查询（F19/F30 接入后生效）
  - inventory.read        # 内部库存、占用与在途的只读查询；与 catalog.read 分开，spec_check 不得持有

# 无论下层怎么声明都一律拒绝。留空即无禁用项。
# procurement.write 不在 granted 之列：外部采购系统与其幂等能力尚未确定（Q-03），
# 在此之前任何外部写入都不该有存在的可能，而不是靠审批拦住。
revoked: []
