# 反馈与升级（F14，spec §5.7；G7：分级、卡片的合法下一步与升级阈值放配置）。

version: 1

# 重规划分级：must = 必须重规划（立即唤醒）；batch = 汇总通知（只进卡片，不唤醒）；未列出的只记录。
levels:
  gate_rejected: must
  invalidation_notice: must
  deviation: must
  claim_conflict: must
  human_decision: must
  task_finished: batch        # 只为未完成 / 失败的子任务生成卡片

# 卡片标题与可选下一步（合法路径，不含模型自评）。
cards:
  gate_rejected:      {title: 门控拒绝,     next: [重新比价, 提出目标修订, 升级给人]}
  invalidation_notice: {title: 失效通知,    next: [重跑失效的步骤, 提出目标修订, 升级给人]}
  deviation:          {title: 偏差,         next: [重新比价, 上报计划员, 提出目标修订, 升级给人]}
  claim_conflict:     {title: 供应冲突,     next: [换来源重新比价, 提出目标修订, 升级给人]}
  task_finished:      {title: 子任务未完成, next: [补派任务, 放弃该分支, 升级给人]}
  human_decision:     {title: 人工应答,     next: [按人工决定继续]}

# 代码强制升级（预算触顶在 F09 runtime 配置里）。
escalation:
  replans_after_rejection: 2        # 同一料号门控拒绝后又重规划达到该次数仍被拒 → 升级
  no_stock_reasons: [现货不足]       # 决策里某料所有来源都因这些原因被过滤（且无选择）→ 视为三家都无货
  fail_grades: [C]                  # 某原料的全部有效验证报告都是这些等级 → 候选全不可用
