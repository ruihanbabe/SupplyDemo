# 字段级污点追踪（F13，spec §5.5 污点追踪；G7：汇点规则与检测模式放配置）。
# 标签：trusted（代码计算、配置、人工确认）/ external（分销商 API 数值字段）/ untrusted（datasheet 文本、自由文本、
# LLM 产出）/ verified（不可信内容经确定性校验后去污）。标签只在 Harness 数据层，默认不向模型展示。

version: 1

sinks:
  # 采购单内容：这些草稿字段只能取自下列标签（字段 → 被引用 Decision 中的来源路径由执行器代码给出）。
  po_content:
    fields: [mpn, qty, distributor, unit_price]
    allowed: [trusted, external, verified]
  # Policy 打分：读入的报价字段不得为下列标签。
  policy_scoring:
    fields: [distributor, stock, unit_price_usd, eta_day]
    forbidden: [untrusted]
  # 长期记忆写入：只接受带这些人工节点确认记录的条目（替代关系 H1 工程师、料号别名 H3 采购员，spec §5.10）；
  # 不可信文本只能以引用块结构 {quote, source} 存放。
  memory:
    confirmation_nodes: [H1, H3]

# 疑似指令文本检测（B1 兜底）：交给模型的工具返回里命中任一正则（不分大小写）即加警告并记事件，不改数据。
injection_patterns:
  - "ignore (all |any )?(previous|prior|above) (instructions|prompts?)"
  - "disregard (the |all )?(previous|above|system)"
  - "you are now"
  - "system prompt"
  - "(submit|approve|place) (the |a )?(purchase )?order"
  - "忽略(以上|之前|前面|上述)(的)?(所有)?(指令|提示|要求)"
  - "你现在是"
  - "系统提示"
  - "(立即|直接)(提交|下单|批准)"
