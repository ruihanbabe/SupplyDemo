# 编排者（F22，spec §2；G7：节点集合、工具集、计划校验参数与固定模板放配置）。

version: 1

# 模式 → 节点集合（可派发的执行者，spec §2.1 路由的硬边界）与编排者工具集（每执行者 ≤ 8，spec §5.4）。
modes:
  S1:
    nodes: [impact_analysis, sourcing, policy, part_profile, substitute_search, verifier, resolver, explainer]
    tools: [dispatch_task, write_plan, env_lookup, ask_user, request_human, po_action, escalate_to_human, end_segment]
  S3:
    nodes: [resolver, part_profile, substitute_search, verifier, explainer]   # 只读节点：没有比价、决策、采购
    tools: [dispatch_task, write_plan, env_lookup, ask_user, escalate_to_human, end_segment]   # S3 只允许 R0（F11），没有 request_human

# 计划校验（spec §2.7）：各节点预估的 LLM 调用数（代码节点为 0），合计不得超过案子剩余 LLM 预算；
# 同一案子连续被拒达 max_rejections 次即退回固定模板。
plan:
  node_cost: {impact_analysis: 0, sourcing: 0, policy: 0, part_profile: 6, substitute_search: 6,
              verifier: 8, resolver: 1, explainer: 1}
  max_rejections: 2

# 固定模板计划（spec §2.7 兜底，§3.6"固定模板"对照组）。S1 为"换供应商采购原料号"路径（草稿与送审由编排者 / 驱动器执行）。
templates:
  S1:
    - {id: T1, executor: impact_analysis, task: 影响分析, depends_on: [], reason: 先算缺口、首次缺料日与停线}
    - {id: T2, executor: sourcing, task: 按缺口比价, depends_on: [T1], reason: 三家报价，部分成功也可用}
    - {id: T3, executor: policy, task: 策略决策, depends_on: [T2], reason: 按配置规则选供应商}
  S3:
    - {id: T1, executor: part_profile, task: 原料画像, depends_on: [], reason: 先定关键约束}
    - {id: T2, executor: verifier, task: 逐项比对候选, depends_on: [T1], reason: 每条结论附引用}
    - {id: T3, executor: explainer, task: 给采购员写结论, depends_on: [T2], reason: 只复述已校验的事实}

# 用户请求路由（spec §2.1）：意图不明时反问，超出范围时拒绝。
router:
  clarify: "请说明是要处置某个缺料 / 异常（例：SKY13453 缺货怎么办），还是问两个料号能不能互换（例：A 能替代 B 吗）？"
  reject: "超出本系统范围：本期只处理缺料异常处置（S1）与料号互换问答（S3）。"
