# datasheet 知识库 A（F19，spec §6；G7：检索参数与种子同义词放配置）。

version: 1

search:
  limit: 5              # 每次检索最多返回的页数
  snippet_chars: 80     # 片段长度（命中处前后）

# 种子同义词（不分大小写）：查询词命中左边任一写法时，同时按整组检索。F20 术语表接入后由术语表替换。
synonyms:
  - [isolation, 隔离度, port-to-port isolation]
  - [insertion loss, 插入损耗, IL]
  - [supply voltage, VDD, 供电电压]
  - [package, 封装]
  - [switching time, 开关时间]

# 出站策略名（F11 config/permissions.yaml egress 段）。
egress_policy: datasheet
