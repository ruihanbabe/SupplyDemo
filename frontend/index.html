<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupplyAgent</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161922; --line:#262b38; --text:#e6e8ee; --muted:#8b93a7;
    --accent:#4c8dff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --user:#1d2331;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#e3e6ec; --text:#1b1f27; --muted:#6b7385;
           --user:#eef2fb; }
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
       background:var(--bg);color:var(--text)}
  header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:14px;margin:0;font-weight:600}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
         color:var(--muted)}
  .badge.replay{border-color:var(--warn);color:var(--warn)}
  .badge.real{border-color:var(--ok);color:var(--ok)}
  main{flex:1;display:grid;grid-template-columns:1fr 420px;min-height:0}
  @media (max-width:900px){ main{grid-template-columns:1fr} #side{display:none} }
  #chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:min(680px,92%);padding:10px 13px;border-radius:10px;white-space:pre-wrap;
       word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--user)}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.err{align-self:flex-start;background:var(--panel);border:1px solid var(--bad);
           color:var(--bad)}
  .caret::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;height:44px;padding:10px;border-radius:8px;
           border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
  button{padding:0 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;
         font:inherit;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #side{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  #side h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
           margin:0}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--panel);
        padding:10px 12px}
  .card h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;
           align-items:center;gap:8px}
  .st{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
  .st.ok{color:var(--ok);border-color:var(--ok)}
  .st.partial{color:var(--warn);border-color:var(--warn)}
  .st.not_found{color:var(--muted)}
  .st.error{color:var(--bad);border-color:var(--bad)}
  pre{margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
      word-break:break-word;color:var(--text)}
  .hint{color:var(--muted);font-size:12px}
  .cut{margin-top:6px;padding-top:6px;border-top:1px dashed var(--bad);
       color:var(--bad);font-size:12px}
  .warnmark{color:var(--warn);font-size:11px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px 4px 0;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:4px 6px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .short{color:var(--bad);font-weight:600}
  .why{color:var(--muted);font-size:11px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:11px}
  .risk{border-left:3px solid var(--warn);padding-left:10px}
  .risk .src{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>SupplyAgent</h1>
  <span class="badge" id="provider">待发送</span>
  <span class="badge" id="run">—</span>
  <span class="hint">左栏是模型写的文字，右栏是确定性查询的结果。数值以右栏为准。</span>
</header>

<main>
  <section id="chat">
    <div id="log">
      <div class="msg bot">问点什么。比如「有哪些项目」「T1 的 BOM 有什么问题」。</div>
    </div>
    <form id="form">
      <textarea id="input" placeholder="Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </form>
  </section>

  <aside id="side">
    <h2>工具调用与结果</h2>
    <div class="hint" id="empty">还没有工具被调用。</div>
  </aside>
</main>

<script>
const log = document.getElementById('log');
const side = document.getElementById('side');
const empty = document.getElementById('empty');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const providerBadge = document.getElementById('provider');
const runBadge = document.getElementById('run');
const history = [];

function bubble(cls, text=''){
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 渲染器按 render 类型登记。工具自己声明类型，前端不靠猜字段——
// 猜法在两个工具返回相似字段时就会串台。未登记的类型退回原始 JSON，
// 所以新工具永远看得见，只是不好看。
const RENDER = {
  projects: rows => rows?.length ? `<table>
      <tr><th>项目</th><th>BOM 行</th><th>总用量</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.project_id)}</td>
        <td class="num">${esc(r.bom_lines)}</td>
        <td class="num">${esc(r.total_quantity)}</td></tr>`).join('')}
    </table>` : '<div class="hint">没有已导入的项目。</div>',

  bom_summary: c => !c ? '' : `
    <div class="stats">
      <div class="stat"><b>${esc(c.line_count)}</b><span>用料行</span></div>
      <div class="stat"><b>${esc(c.lines_without_candidates)}</b><span>无候选</span></div>
      <div class="stat"><b>${esc(c.lines_needing_selection)}</b><span>待选型</span></div>
      <div class="stat"><b>${esc(c.lines_with_unverified_quantity_basis)}</b><span>口径未核验</span></div>
    </div>
    <table><tr><th>行</th><th>位号</th><th>单板用量</th><th>候选</th></tr>
      ${(c.sample || []).map(r => `<tr><td>${esc(r.line_id)}</td>
        <td>${esc((r.reference || '').slice(0, 24))}</td>
        <td class="num">${esc(r.quantity)}</td>
        <td>${esc((r.candidate_mpns || []).join(' / '))}</td></tr>`).join('')}
    </table>`,

  // 缺口表的重点不是数字，是「为什么缺」——只给一个数看不出所以然。
  shortage: c => !c?.rows?.length ? '<div class="hint">没有缺口。</div>' : `
    <table><tr><th>元件</th><th>需求</th><th>可分配</th><th>缺口</th></tr>
      ${c.rows.map(r => `<tr>
        <td>${esc(r.mpn)}${r.why ? `<div class="why">${esc(r.why)}</div>` : ''}</td>
        <td class="num">${esc(r.required_qty)}</td>
        <td class="num">${esc(r.allocatable_qty)}</td>
        <td class="num short">${esc(r.shortage_qty)}</td></tr>`).join('')}
    </table>
    ${c.policy_versions ? `<div class="why" style="margin-top:6px">口径版本：
      ${Object.entries(c.policy_versions).map(([k, v]) => `${esc(k)} v${esc(v)}`).join('，')}</div>` : ''}`,

  // 多源报价。分歧不合并——三家说 6484/0/2802，平均值是没人能照着下单的数字。
  offers: c => !c?.rows?.length ? '' : `
    <table><tr><th>来源</th><th>SKU / 匹配</th><th>库存</th><th>交期</th><th>单价</th></tr>
      ${c.rows.map(r => r.status === 'ok' || r.status === 'partial' ? `<tr>
          <td>${esc(r.provider)}
            <div class="why ${r.provenance !== 'real' ? 'warnmark' : ''}">${esc(r.provenance)}</div></td>
          <td>${esc(r.distributor_sku)}
            <div class="why ${r.match_status !== 'exact' ? 'warnmark' : ''}">${esc(r.match_status)}</div></td>
          <td class="num">${r.stock_qty === null || r.stock_qty === undefined
              ? '<span class="why">未知</span>' : esc(r.stock_qty)}</td>
          <td class="num">${r.lead_time_days === null || r.lead_time_days === undefined
              ? '<span class="why">未知</span>' : esc(r.lead_time_days) + ' 天'}</td>
          <td class="num">${r.unit_price_at_moq === null || r.unit_price_at_moq === undefined
              ? '<span class="why">未知</span>'
              : esc(r.unit_price_at_moq) + ' <span class="why">' + esc(r.price_currency || '无币种') + '</span>'}</td>
        </tr>` : `<tr><td>${esc(r.provider)}</td>
          <td colspan="4" class="why">${esc(r.status)}${r.error_code ? ' · ' + esc(r.error_code) : ''}
            ——${esc(r.message || '')}</td></tr>`).join('')}
    </table>
    ${c.stock_disagreement ? '<div class="warnmark" style="margin-top:6px">⚠ 各源库存不一致，已各自保留，未取平均</div>' : ''}
    ${c.prices_comparable === false ? `<div class="warnmark">⚠ 价格币种不一致（${esc((c.currencies||[]).join('、'))}），本系统没有经核验的汇率，不可直接比价</div>` : ''}
    ${c.inexact_matches?.length ? `<div class="warnmark">⚠ ${esc(c.inexact_matches.join('、'))} 的型号匹配非精确，需人工确认后才可采纳</div>` : ''}`,
};

function panel(kind, content, message){
  const render = RENDER[kind];
  if (render) {
    const html = render(content);
    if (html) return html;
  }
  const pre = document.createElement('pre');
  pre.textContent = content == null ? (message || '（无内容）')
    : JSON.stringify(content, null, 2);
  return pre.outerHTML;
}

function card(evt){
  empty.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<h3><span></span><span class="st ${evt.status}">${evt.status}</span></h3>
                  <div class="body"></div>`;
  el.querySelector('h3 span').textContent = evt.name;
  const body = el.querySelector('.body');
  body.innerHTML = panel(evt.render || 'raw', evt.content, evt.message);
  if (evt.message && evt.content != null) {
    const note = document.createElement('div');
    note.className = 'why';
    note.style.marginTop = '6px';
    note.textContent = evt.message;
    body.appendChild(note);
  }
  side.appendChild(el);
  side.scrollTop = side.scrollHeight;
}

// RiskEvent 是异步进来的提示，不占用工具卡片的位置。
function risk(evt){
  empty.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'card risk';
  el.innerHTML = `<h3><span></span><span class="st partial">${esc(evt.severity || 'risk')}</span></h3>
                  <div></div><div class="src"></div>`;
  el.querySelector('h3 span').textContent = evt.subject || 'RiskEvent';
  el.querySelectorAll('div')[0].textContent = evt.detail || '';
  el.querySelector('.src').textContent =
    `来源：${evt.source || '未知'}` + (evt.rule_ref ? ` · ${evt.rule_ref}` : '');
  side.appendChild(el);
  side.scrollTop = side.scrollHeight;
}

async function ask(message){
  const mine = bubble('user', message);
  history.push({role:'user', content:message});
  let reply = null, buffered = '';

  const response = await fetch('/api/chat/stream', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message, history: history.slice(0,-1).slice(-10)})
  });
  if(!response.ok){ bubble('err', `HTTP ${response.status}`); return; }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let carry = '';

  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    carry += decoder.decode(value, {stream:true});
    const frames = carry.split('\n\n');
    carry = frames.pop();
    for(const frame of frames){
      const nameLine = frame.match(/^event: (.+)$/m);
      const dataLine = frame.match(/^data: (.*)$/m);
      if(!nameLine || !dataLine) continue;
      const evt = JSON.parse(dataLine[1]);
      switch(nameLine[1]){
        case 'meta':
          providerBadge.textContent = `${evt.provider} · ${evt.model}`;
          providerBadge.className = 'badge ' + (evt.provenance === 'real' ? 'real' : 'replay');
          providerBadge.title = evt.provenance === 'real'
            ? '真实模型调用，按量计费' : '回放录音，未联网、无花费';
          runBadge.textContent = 'run ' + evt.run_id.slice(0,8);
          break;
        case 'text':
          if(!reply){ reply = bubble('bot'); reply.classList.add('caret'); }
          buffered += evt.text;
          reply.textContent = buffered;
          log.scrollTop = log.scrollHeight;
          break;
        case 'risk':
          risk(evt);
          break;
        case 'tool':
          card(evt);
          if(reply){ reply.classList.remove('caret'); reply = null; buffered = ''; }
          break;
        case 'error':
          if(reply){
            reply.classList.remove('caret');
            // 失败发生在已经输出文字之后：屏幕上那段是残片，不是一个简短的回答。
            // 不标出来的话，半句话看起来和完整回答没有区别。
            if(evt.after_text){
              const cut = document.createElement('div');
              cut.className = 'cut';
              cut.textContent = '⋯ 回答在此中断，以上内容不完整';
              reply.appendChild(cut);
            }
          }
          bubble('err', `${evt.code}：${evt.message}`);
          break;
        case 'done':
          if(reply) reply.classList.remove('caret');
          if(buffered) history.push({role:'assistant', content:buffered});
          break;
      }
    }
  }
  if(reply) reply.classList.remove('caret');
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const message = input.value.trim();
  if(!message) return;
  input.value = ''; send.disabled = true;
  try { await ask(message); }
  catch(err){ bubble('err', String(err)); }
  finally { send.disabled = false; input.focus(); }
});

input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
